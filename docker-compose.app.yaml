services:
  api:
    build:
      context: .
      args:
        VITE_ASSET_BASE_URL: ${VITE_ASSET_BASE_URL:-}
    container_name: haejoong.com-api
    depends_on:
      haejoong.com-db:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - 3000
    environment:
      NODE_ENV: production
      POSTGRES_HOST: haejoong.com-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: haejoong.com-cache
      REDIS_PORT: 6379
      UPLOAD_DIR: /data/uploads
      UPLOAD_PUBLIC_BASE_URL: ${UPLOAD_PUBLIC_BASE_URL:-}
      FRONTEND_DIST_DIR: /usr/src/app/backend/public
    env_file:
      - .env
    volumes:
      - ${UPLOADS_PATH:-./backend/uploads}:/data/uploads
    networks: 
      - gateway
